name: CI/CD Pipeline

on:
  push:
    branches: ["master", "main"]
  pull_request:

env:
  DOCKER_IMAGE: ghcr.io/highl0ad/mafia_game

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run unit tests
        run: pytest

  build-and-push:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy to Dokploy
        env:
          DOKPLOY_URL: https://dokploy.homeabil.online
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          COMPOSE_ID: gCP9h6RZdWtsvREC-W9jv
        run: |
          set -euo pipefail
          api() { curl -fsS --retry 3 --retry-delay 2 -H "x-api-key: $DOKPLOY_API_KEY" -H "content-type: application/json" "$@"; }
          deployments() { api "$DOKPLOY_URL/api/compose.one?composeId=$COMPOSE_ID"; }
          before=$(deployments | jq -r '[.deployments[].createdAt] | max // ""')
          api -X POST "$DOKPLOY_URL/api/compose.deploy" \
            -d "$(jq -n --arg id "$COMPOSE_ID" --arg t "${GITHUB_SHA::7}" '{composeId: $id, title: $t}')" >/dev/null
          for _ in $(seq 1 60); do
            sleep 5
            st=$(deployments | jq -r --arg b "$before" '[.deployments[] | select(.createdAt > $b)] | sort_by(.createdAt) | last | .status // "queued"')
            echo "Dokploy deployment status: $st"
            case "$st" in
              done) exit 0 ;;
              error) echo "Dokploy deployment failed" >&2; exit 1 ;;
            esac
          done
          echo "Timed out waiting for Dokploy deployment" >&2
          exit 1

      - name: Health check
        run: |
          curl --fail --silent --show-error --location --retry 10 --retry-all-errors --retry-delay 5 \
            https://mafia.abil.space/ >/dev/null
